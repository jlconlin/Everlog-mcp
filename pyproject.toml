[project]
name = "everlog-mcp"
version = "0.1.0"
description = "Read-only MCP server for the Everlog journal app (macOS)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jeremy Lloyd Conlin", email = "jlconlin@me.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3,<3",
]

[project.scripts]
everlog-mcp = "everlog_mcp:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
